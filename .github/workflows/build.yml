name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip source
        run: |
          ZIP=$(ls *.zip | head -n 1)
          unzip -o "$ZIP"
          chmod +x gradlew
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace
      - name: Build release APK
        continue-on-error: true
        run: ./gradlew :app:assembleRelease --stacktrace
      - name: Collect APKs
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/LoomisStudio-debug.apk
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then cp app/build/outputs/apk/release/app-release.apk dist/LoomisStudio-release.apk; fi
      - uses: actions/upload-artifact@v4
        with:
          name: LoomisStudio-apk
          path: dist/*.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Loomis Studio
          prerelease: true
          files: dist/*.apk
